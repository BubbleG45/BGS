services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "18090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bgs
      POSTGRES_PASSWORD: "N-0xeFsFISYKzi7wOvkdJR3HvhepmGju"
    volumes:
      - bgs_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "18091:6379"
    command: redis-server --requirepass "dM7DCBgHRi_Ti1gdsXVZ8Lupn8gqudg_"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "19090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bgs_test
      POSTGRES_PASSWORD: "8Ioe-ZoYjxBMoeug6mipqY9r7y0avY75"
    volumes:
      - bgs_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "19091:6379"
    command: redis-server --requirepass "qVo7fW9XKiDmOa6WP11BQ9XHCZg2LaGL"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  bgs_data:
  bgs_test_data:
